[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heurica-tap"
version = "0.1.0"
description = "Text Action Protocol (TAP): tool use through plain text, with a lenient reply parser and a small agent loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Heurica", email = "hello@heurica.dev" }]
maintainers = [{ name = "Heurica", email = "hello@heurica.dev" }]
keywords = ["llm", "agents", "tool-use", "tool-calling", "protocol", "parser", "ai", "function-calling", "json-repair", "text-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://heurica.dev/tap"
Source = "https://github.com/heurica-labs/tap/tree/main/packages/python"
Issues = "https://github.com/heurica-labs/tap/issues"
Documentation = "https://github.com/heurica-labs/tap/blob/main/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heurica_tap = ["py.typed"]
