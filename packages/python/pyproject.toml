[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heurica-tap"
version = "0.1.0"
description = "Text Action Protocol (TAP): tool use through plain text, with a lenient reply parser and a small agent loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
